name: Build catalog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build (Atom + topic enrichment) or probe (feed/page connectivity only)"
        required: false
        default: "build"
      force_rebuild:
        description: "Publish a new release even when the catalog is unchanged"
        required: false
        default: "false"
      topics:
        description: "Comma-separated topic IDs (Atom still runs; overrides normal rotation)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: pipensx-catalog
  cancel-in-progress: false

jobs:
  # Report-only probe: validate the public Atom feed and test one live topic
  # through direct/proxy/cookie transports. Never publishes catalog data.
  probe:
    if: github.event.inputs.mode == 'probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Atom feed and topic transports
        shell: bash
        env:
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
          RUTRACKER_COOKIE: ${{ secrets.RUTRACKER_COOKIE }}
        run: |
          set -u
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          feed = "https://feed.rutracker.cc/atom/f/1605.atom"
          topic = "https://rutracker.org/forum/viewtopic.php?t=6892780"
          try:
              request = urllib.request.Request(
                  feed, headers={"User-Agent": "pipensx-catalog-probe/1"})
              with urllib.request.urlopen(request, timeout=25) as response:
                  payload = response.read(2 * 1024 * 1024)
              root = ET.fromstring(payload)
              ns = "{http://www.w3.org/2005/Atom}"
              entries = root.findall(ns + "entry")
              print(f"atom: HTTP 200 entries={len(entries)} bytes={len(payload)}")
              if entries:
                  topic_id = entries[0].findtext(ns + "id", default="")
                  topic_id = topic_id.rsplit("/t/", 1)[-1]
                  if topic_id.isdigit():
                      topic = ("https://rutracker.org/forum/viewtopic.php"
                               f"?t={topic_id}")
          except Exception as error:
              print(f"atom: ERROR {type(error).__name__}")

          transports = [
              ("direct", "", ""),
              ("proxy", os.environ.get("SCRAPER_PROXY", ""), ""),
              ("cookie", "", os.environ.get("RUTRACKER_COOKIE", "")),
              ("proxy+cookie", os.environ.get("SCRAPER_PROXY", ""),
               os.environ.get("RUTRACKER_COOKIE", "")),
          ]
          for name, proxy, cookie in transports:
              if "proxy" in name and not proxy:
                  print(f"{name}: skipped (no SCRAPER_PROXY secret)")
                  continue
              if "cookie" in name and not cookie:
                  print(f"{name}: skipped (no RUTRACKER_COOKIE secret)")
                  continue
              handlers = []
              if proxy:
                  handlers.append(urllib.request.ProxyHandler(
                      {"http": proxy, "https": proxy}))
              opener = urllib.request.build_opener(*handlers)
              headers = {"User-Agent": "Mozilla/5.0"}
              if cookie:
                  headers["Cookie"] = cookie
              try:
                  request = urllib.request.Request(topic, headers=headers)
                  with opener.open(request, timeout=25) as response:
                      body = response.read()
                      challenge = (b"Just a moment" in body or
                                   b"cf-mitigated" in body)
                      print(f"{name}: HTTP {response.status} bytes={len(body)} "
                            f"challenge={challenge}")
              except urllib.error.HTTPError as error:
                  body = error.read(8192)
                  challenge = (b"Just a moment" in body or
                               b"cf-mitigated" in body)
                  print(f"{name}: HTTP {error.code} challenge={challenge}")
              except Exception as error:
                  print(f"{name}: ERROR {type(error).__name__}")
          PY

  build:
    if: github.event.inputs.mode != 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Test generator and scraper
        run: python3 -m unittest discover -s tests -v

      - name: Download previous snapshot
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/main/catalog.json" \
            -o /tmp/previous-catalog.json
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/main/manifest.json" \
            -o /tmp/previous-manifest.json
          echo "previous_sha=$(jq -r .catalog.sha256 /tmp/previous-manifest.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Scrape Atom window and enrich topic pages
        id: scrape
        shell: bash
        env:
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
          RUTRACKER_COOKIE: ${{ secrets.RUTRACKER_COOKIE }}
          TOPICS_INPUT: ${{ github.event.inputs.topics }}
        run: |
          set -euo pipefail
          if [[ -n "$TOPICS_INPUT" ]]; then
            topics="$TOPICS_INPUT"
          else
            # One 120-topic legacy window per daily run. Atom independently
            # discovers recent new/updated topics; duplicates are removed.
            topics="$(python3 - <<'PY'
          import json, time
          previous = json.load(open('/tmp/previous-catalog.json'))
          topic_ids = sorted({str(e.get('topic_id')) for e in previous
                              if e.get('topic_id')})
          window = 120
          start = ((int(time.time()) // 86400) * window) % max(1, len(topic_ids))
          print(','.join((topic_ids + topic_ids)[start:start + window]))
          PY
          )"
          fi
          # Coverage veto exits 2; the previous snapshot is never shrunk.
          python3 scrape.py \
            --previous /tmp/previous-catalog.json \
            --previous-manifest /tmp/previous-manifest.json \
            --output output \
            --overrides overrides.json \
            --atom \
            --topics "$topics" \
            --delay 2 \
            --catalog-commit "$GITHUB_SHA"

      - name: Decide publish
        id: publish
        shell: bash
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          set -euo pipefail
          new_sha="$(jq -r .catalog.sha256 output/manifest.json)"
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"
          if [[ "$new_sha" == "${{ steps.previous.outputs.previous_sha }}" && \
                "$FORCE_REBUILD" != "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=catalog-${new_sha:0:12}-run-${GITHUB_RUN_NUMBER}" \
            >> "$GITHUB_OUTPUT"

      - name: Publish immutable release
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.publish.outputs.tag }}" \
            output/catalog.json output/manifest.json output/report.md \
            --repo "$GITHUB_REPOSITORY" \
            --title "Catalog ${{ steps.publish.outputs.tag }}" \
            --notes "Atom + topic-page scrape sha ${{ steps.publish.outputs.new_sha }}" \
            --latest

      - name: Update main snapshot (raw channel)
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp output/catalog.json catalog.json
          cp output/manifest.json manifest.json
          cp output/report.md report.md
          git add catalog.json manifest.json report.md
          git diff --quiet --cached && echo "snapshot unchanged" && exit 0
          git commit -m "data: refresh catalog snapshot"
          git push origin HEAD:${GITHUB_REF_NAME}
