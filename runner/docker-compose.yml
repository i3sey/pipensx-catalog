services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: catalog-flaresolverr
    env_file:
      - .env
    environment:
      - LOG_LEVEL=info
      - HTTP_PROXY=${SCRAPER_PROXY:-}
      - HTTPS_PROXY=${SCRAPER_PROXY:-}
    tmpfs:
      - /tmp:rw,size=2G
    restart: unless-stopped

  catalog-runner:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/i3sey/pipensx-catalog:latest
    container_name: catalog-runner
    depends_on:
      - flaresolverr
    env_file:
      - .env
    environment:
      - FLARESOLVERR_HOST=flaresolverr
      - FORCE_PUBLISH=${FORCE_PUBLISH:-0}
    volumes:
      # Persistent SQLite database volume
      - catalog-data:/state
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  catalog-data:
